<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects shelf test · Képler Siguineau</title>
  <link rel="shortcut icon" type="image/x-icon" href="../generalAssets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/learnNav.css">
  <style>
    :root {
      --red: #D31034;
      --blue: #0020A0;
      --green: #005315;
      --bg: #F0F1F3;
      --surface: #ffffff;
      --text: #1a1a1a;
      --muted: #5c6370;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .shelf-page {
      width: min(1080px, 92%);
      margin: 0 auto;
      padding: 28px 0 64px;
    }

    .shelf-kicker {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.6rem, 4vw, 2rem);
      letter-spacing: -0.02em;
    }

    .shelf-lead {
      margin: 0 0 24px;
      max-width: 38rem;
      color: var(--muted);
      font-size: 15px;
    }

    .shelf-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }

    .shelf-filter {
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .shelf-filter.is-active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .shelf-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .shelf-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(0, 0, 0, 0.05);
      padding: 18px 18px 16px;
      text-decoration: none;
      color: inherit;
      min-height: 132px;
      transition: transform 0.15s, border-color 0.15s;
    }

    .shelf-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 32, 160, 0.2);
    }

    .shelf-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .shelf-card h2 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .shelf-pill {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--bg);
      color: var(--muted);
    }

    .shelf-pill--haiti { background: rgba(0, 83, 21, 0.1); color: var(--green); }
    .shelf-pill--product { background: rgba(211, 16, 52, 0.08); color: var(--red); }
    .shelf-pill--client { background: rgba(0, 32, 160, 0.08); color: var(--blue); }

    .shelf-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .shelf-empty {
      grid-column: 1 / -1;
      color: var(--muted);
      padding: 24px 0;
    }

    @media (max-width: 720px) {
      .shelf-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shelf-page">
    <p class="shelf-kicker">Test page</p>
    <h1>Projects</h1>
    <p class="shelf-lead">
      A short line on each project, then a filter. This is a mock of the public shelf. The old red button list is still at pages.html.
    </p>
    <div class="shelf-filters" id="shelfFilters" role="tablist" aria-label="Project type"></div>
    <div class="shelf-grid" id="shelfGrid"></div>
  </div>

  <script type="module">
    import { initLearnNav } from "./scripts/learnNav.js";
    import { PROJECT_LANES, PROJECTS } from "./scripts/projectsShelfCatalog.js";

    if (window.parent === window) {
      initLearnNav("projects");
    }

    const filtersEl = document.getElementById("shelfFilters");
    const gridEl = document.getElementById("shelfGrid");
    const laneLabels = {
      product: "Product",
      client: "Client",
      haiti: "Haiti",
    };

    let activeLane = "all";

    function renderFilters() {
      filtersEl.innerHTML = PROJECT_LANES.map((lane) => `
        <button type="button" class="shelf-filter${lane.id === activeLane ? " is-active" : ""}" data-lane="${lane.id}">
          ${lane.label}
        </button>
      `).join("");

      filtersEl.querySelectorAll("[data-lane]").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeLane = btn.dataset.lane;
          renderFilters();
          renderCards();
        });
      });
    }

    function renderCards() {
      const list = activeLane === "all"
        ? PROJECTS
        : PROJECTS.filter((item) => item.lane === activeLane);

      if (!list.length) {
        gridEl.innerHTML = `<p class="shelf-empty">Nothing in this lane yet.</p>`;
        return;
      }

      gridEl.innerHTML = list.map((item) => `
        <a class="shelf-card" href="${item.href}">
          <div class="shelf-card-top">
            <h2>${item.name}</h2>
            <span class="shelf-pill shelf-pill--${item.lane}">${laneLabels[item.lane]}</span>
          </div>
          <p>${item.blurb}</p>
        </a>
      `).join("");
    }

    renderFilters();
    renderCards();
  </script>
</body>
</html>
